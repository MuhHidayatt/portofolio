<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810" />
      <stop offset="100%" stop-color="#0d1321" />
    </linearGradient>
    
    <!-- Text / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    
    <!-- Subtle Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Card Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Geometric Initials "MH" -->
  <text x="50%" y="54%" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="200" 
        fill="url(#accentGrad)" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="-10">MH</text>
</svg>
